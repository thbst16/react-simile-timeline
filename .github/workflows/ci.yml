name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref rather than letting them finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (node ${{ matrix.node }}, TZ ${{ matrix.tz }})
    runs-on: ubuntu-latest

    # Least privilege. Without an explicit block both jobs inherit the
    # repository default GITHUB_TOKEN scope, which is far wider than either
    # needs - this job only reads the checkout. Flagged by CodeQL
    # (actions/missing-workflow-permissions) since code scanning was added in
    # #11; codeql.yml and release.yml already scope theirs.
    permissions:
      contents: read

    strategy:
      # One failing leg must not cancel the others - the whole point of a matrix
      # is knowing which environments break, not just that one did.
      fail-fast: false
      matrix:
        # Node 18 was dropped when the toolchain moved to Vite 8, which
        # requires ^20.19.0 || >=22.12.0. Node 18 reached end of life in April
        # 2025. engines.node was narrowed to match rather than left claiming a
        # runtime nothing exercises.
        node: [20, 22, 24]
        tz: [UTC]
        include:
          # Non-UTC leg, now blocking. GitHub runners are UTC, which hid a real
          # date-parsing defect for months: parseDate read YYYY-MM-DD as UTC
          # midnight and formatted it with local getters, so date-only events
          # rendered a day early at negative offsets (#13).
          #
          # The defect is fixed and this leg passes, so it is a required check
          # rather than an advisory one. Do not weaken it back to
          # continue-on-error - a green UTC-only suite is exactly what let the
          # original defect survive for eight months.
          - node: 20
            tz: America/Chicago

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@v4

      # No `version:` input - the pnpm version is read from the
      # `packageManager` field in package.json, so CI and local development
      # cannot drift apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build library
        run: pnpm build:lib

      # Guards the exports map against silently breaking type resolution.
      # The require condition once pointed at an index.d.cts that was never
      # emitted, so every CommonJS consumer on node16/nodenext got an
      # untyped module while the build stayed green (#14).
      - name: Check package exports
        run: pnpm --filter react-simile-timeline check:exports

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # Proves the lower bound of the peer range. The library's own dev/test
  # environment runs React 19 (matching the @types/react it ships against);
  # peerDependencies promise `^18 || ^19`, and until this job existed the 18
  # half was never exercised - the credibility gap #21 was filed to close.
  # React 18 is also covered end-to-end by the `e2e` job, whose demo pins
  # React 18; this leg adds the unit level.
  unit-react18:
    name: unit-react18 (peer floor)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pin the React 18 floor for the library's test environment. Not written
      # to the lockfile - this is a throwaway CI mutation to run the same suite
      # against the older supported runtime. @testing-library/react 16 already
      # supports both React 18 and 19, so only React itself is moved.
      - name: Pin React 18
        run: >-
          pnpm --filter react-simile-timeline add -D
          react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18

      - name: Unit tests on React 18
        run: pnpm --filter react-simile-timeline test

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    # Least privilege, as above. The Playwright report upload on failure goes
    # through the Actions artifact API rather than a token scope, so read on
    # contents is enough - verified by forcing a failing run, not assumed.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Install Playwright browsers
        run: pnpm --filter demo exec playwright install chromium

      - name: Build demo
        run: pnpm --filter demo build

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: demo/playwright-report/
          retention-days: 7
